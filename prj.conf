# The sensor, on an emulated I2C bus (see app.overlay).
CONFIG_SENSOR=y
CONFIG_I2C=y
CONFIG_EMUL=y

CONFIG_LOG=y
CONFIG_PRINTK=y

CONFIG_SHELL=y

# One software watchdog channel per thread. On a board with a hardware watchdog, also
# enable CONFIG_WATCHDOG and CONFIG_TASK_WDT_HW_FALLBACK, so that a stuck kernel (which
# would stop the software timer too) is caught as well.
CONFIG_TASK_WDT=y
CONFIG_REBOOT=y

CONFIG_THREAD_NAME=y
CONFIG_THREAD_STACK_INFO=y
CONFIG_ASSERT=y
CONFIG_STACK_SENTINEL=y
CONFIG_COMPILER_WARNINGS_AS_ERRORS=y
