CONFIG_ZTEST=y
CONFIG_ZTEST_SHUFFLE=n

CONFIG_SENSOR=y
CONFIG_I2C=y
CONFIG_EMUL=y
CONFIG_LOG=y

# Shell commands are run through the dummy backend and their output is checked.
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=n
CONFIG_SHELL_BACKEND_DUMMY=y
CONFIG_SHELL_BACKEND_DUMMY_BUF_SIZE=1024
CONFIG_SHELL_DUMMY_INIT_LOG_LEVEL_NONE=y
CONFIG_SHELL_LOG_BACKEND=n

CONFIG_ASSERT=y
CONFIG_COMPILER_WARNINGS_AS_ERRORS=y
